<title id="title">Seva Hifi</title>
<desc id="desc">Selected Seva Hifi logo, 11C refined. Curved SEVA capitals with custom joins. In HIFI, H and the first I stand separately; F joins only to the final I at the top. Outlined vector artwork with transparent background.</desc>
